[package]
name = "h3d"
version = "0.1.0"
edition = "2024"
description = "H3D: an interactive 3D Gaussian Splatting viewer built with Dioxus Native"
license = "MIT"

[dependencies]
dioxus = { version = "=0.8.0-alpha.3", features = ["native"] }
dioxus-native = "=0.8.0-alpha.3"
anyrender = "0.14.0"
blitz-dom = { version = "=0.3.0-beta.4", default-features = false, features = ["custom-widget"] }
blitz-traits = "=0.3.0-beta.4"
peniko = "0.6"
wgpu = "30.0.1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
